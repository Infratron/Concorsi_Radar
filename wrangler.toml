name = "concorsi-radar"
main = "src/index.ts"
# Data di compatibilità: congelata al comportamento già verificato in locale e
# nei test. Alzarla cambia il runtime (non il codice): fallo di proposito, con un
# giro di test e la prova `npm run dry-run` dopo, non come effetto collaterale di
# un aggiornamento di wrangler.
compatibility_date = "2025-07-18"
workers_dev = true

# Workers AI: usata SOLO per gli item ambigui, con tetto giornaliero (10.000 Neurons/giorno sul piano Free).
[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "concorsi-radar"
# Id del database creato con `npm run db:create`. Non è un segreto: identifica il
# database nell'account e senza di esso la build di Workers Builds non pubblica.
database_id = "2c47a097-ad0e-4872-b868-9d9b3efe0dbb"

# 3 trigger (limite Free = 5 per account):
#  - avvisi istantanei e pulizia ogni 15 minuti
#  - due digest: 06:05 UTC (= 08:05 CEST / 07:05 CET) e 17:05 UTC (= 19:05 CEST / 18:05 CET)
# La raccolta dei feed non è più un cron del Worker: la rete di Cloudflare viene
# bloccata da diverse fonti italiane (403/503), quindi la fa GitHub Actions
# (.github/workflows/ingest.yml) sulla stessa pipeline e sullo stesso D1.
[triggers]
crons = ["*/15 * * * *", "5 6 * * *", "5 17 * * *"]

[observability]
enabled = true

# Secrets richiesti (mai nel file):
#   wrangler secret put TELEGRAM_BOT_TOKEN
#   wrangler secret put WEBHOOK_SECRET
#   wrangler secret put ADMIN_CHAT_ID
