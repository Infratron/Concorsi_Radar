# Allineamento del database D1, da solo.
#
# Perché esiste: fino a ieri ogni colonna nuova costava una riga di SQL eseguita a
# mano PRIMA di pubblicare il codice che la legge, e ogni fonte nuova un
# `npm run db:seed` da un PC. Sono i due comandi che si dimenticano, e che
# dimenticati fanno fallire le scritture in produzione (o lasciano una fonte
# spenta senza che nessuno se ne accorga).
#
# Qui girano insieme a ogni push che tocca lo schema o la configurazione delle
# fonti, con le stesse tre repository secret della raccolta:
#   CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_API_TOKEN (D1:Edit), D1_DATABASE_ID
#
# Il comando è idempotente: `CREATE ... IF NOT EXISTS` per tabelle e indici,
# `ALTER TABLE ADD COLUMN` solo per le colonne che mancano davvero, e UPSERT per
# le fonti, che non tocca lo stato runtime (etag, ultimo giro, fallimenti).
name: Database

on:
  push:
    branches: [main]
    paths:
      - "src/db/schema.sql"
      - "src/db/upgrade.ts"
      - "src/db/seeds.ts"
      - "src/config/sources.ts"
      - "scripts/db-upgrade.ts"
      - "scripts/seed-sources.ts"
      - ".github/workflows/db.yml"
  # Per riallineare a mano dopo una modifica fatta in dashboard.
  workflow_dispatch:

# Un allineamento alla volta: due ALTER in parallelo sulla stessa colonna sono un
# errore certo ("duplicate column name"), anche se la prima ha già fatto il lavoro.
concurrency:
  group: db
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  db:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Nessuna dipendenza da installare: lo script usa solo Node (fetch, node:)
      # e i moduli TypeScript del repository, come la raccolta.
      - name: Allinea schema e fonti
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: npm run db:sync
